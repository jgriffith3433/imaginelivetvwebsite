:root{--acc:#8fc2ff}
body{perspective:2400px;background:#000}

// ---------------------------------------------------------------- the back: its opposite (drawn light on black, shown as ink on paper)
// THE OPPOSITE OF THE STAR: a black hole. Inside the event horizon (radius r_s = 2GM/c^2: 3 km per solar mass)
// nothing gets out, light included. What is drawn is what can be seen:
//  * its shadow, 2.6 r_s across the sky (sqrt(27)/2 r_s in radius), which is what the Event Horizon Telescope imaged
//  * gas in a disk, orbiting faster closer in (Kepler: speed ~ r^-1/2), brighter on the side coming toward us
//    (Doppler beaming), with the far side of the disk bent up and over the top by the hole's gravity
//  * the stars behind it, moved and doubled by gravitational lensing: a star at angle beta from the centre appears at
//    theta = (beta +- sqrt(beta^2 + 4 theta_E^2)) / 2, so stars passing behind smear into arcs and a ring.

// ---------------------------------------------------------------- page
var cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 0, Hh = 0, dpr = 1, me = D.scales[D.i];

document.getElementById('sub').textContent = me.sub;
